name: Check ZIP Contents

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show what is inside ZIP
        run: |
          echo "=== Список файлов в архиве ==="
          unzip -l "Cot Launcher.zip"
