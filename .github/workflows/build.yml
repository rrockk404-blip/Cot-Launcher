name: Find Gradlew

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Search for gradlew
        run: |
          unzip -q "Cot Launcher.zip"
          echo "=== Точное местоположение файла gradlew ==="
          find . -name "gradlew"
