name: Unpack and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project files
        run: |
          unzip -q "Cot Launcher.zip"
          mv "./Cot Launcher/Cot Launcher/"* . 2>/dev/null || mv "./Cot Launcher/"* . 2>/dev/null || true
          rm -f "Cot Launcher.zip"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Build All Debug APKs
        run: |
          # Собираем абсолютно все варианты debug-версий, которые есть в проекте, игнорируя недостающие ядра
          ./gradlew assembleDebug -x :bundled-cores:assembleDebug -x :bundled-cores:assembleRelease || ./gradlew assembleDebug || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-mod-apk
          path: "**/build/outputs/apk/**/*.apk"
