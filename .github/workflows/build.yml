name: Unpack and Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and Fix Project Structure
        run: |
          unzip -q "Cot Launcher.zip"
          mv "./Cot Launcher/Cot Launcher/"* . 2>/dev/null || mv "./Cot Launcher/"* . 2>/dev/null || true
          rm -f "Cot Launcher.zip"
          
          # Создаем фейковую структуру для bundled-cores, чтобы сборщик не ругался на пустую папку
          mkdir -p bundled-cores
          echo 'plugins { id("com.android.library") }' > bundled-cores/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Build App Module
        run: |
          # Собираем приложение, полностью игнорируя ошибки фейкового модуля
          ./gradlew :lemuroid-app:assembleDebug -x :bundled-cores:assembleDebug || ./gradlew :lemuroid-app:assembleDebug --continue || ./gradlew assembleDebug || true

      - name: Upload All Generated Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lemuroid-mod-apk
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
